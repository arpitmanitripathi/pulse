# Local stack: `docker compose up --build`
# Host ports avoid the defaults (5432, 6379) so Pulse can run next to other projects.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5433:5432"
    volumes:
      - pulse-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"   # web inbox: http://localhost:8025
      - "1025:1025"   # SMTP

  app:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pulse
      DB_USER: pulse
      DB_PASSWORD: pulse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-dev-only-secret-change-me-in-production
      COOKIE_SECURE: "false"   # plain http on localhost; production uses true
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pulse-pg:
