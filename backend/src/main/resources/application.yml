spring:
  application:
    name: pulse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pulse}
    username: ${DB_USER:pulse}
    password: ${DB_PASSWORD:pulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui

pulse:
  auth:
    jwt-secret: ${JWT_SECRET:}          # required, at least 32 characters; the app refuses to start without it
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: ${COOKIE_SECURE:true}
  rate-limit:
    auth-per-minute: 10
    public-per-minute: 60
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    batch-size: 100        # monitors claimed per tick
    max-in-flight: 500     # checks running at once on this instance
