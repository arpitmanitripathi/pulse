spring:
  application:
    name: pulse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pulse}
    username: ${DB_USER:pulse}
    password: ${DB_PASSWORD:pulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}          # Mailpit locally
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false   # an email outage must not mark the app unhealthy; alerts retry on their own

springdoc:
  swagger-ui:
    path: /swagger-ui

pulse:
  auth:
    jwt-secret: ${JWT_SECRET:}          # required, at least 32 characters; the app refuses to start without it
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: ${COOKIE_SECURE:true}
    app-url: ${APP_URL:http://localhost:5173}   # the web app's address, used in password reset emails
  ssrf:
    # Host names whose private addresses are allowed. EMPTY in every real deployment;
    # only the load-test stack sets it, to its WireMock target (docs/DESIGN.md).
    trusted-hosts: ${PULSE_SSRF_TRUSTED_HOSTS:}
  rate-limit:
    auth-per-minute: 10
    public-per-minute: 60
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    batch-size: 100        # monitors claimed per tick
    max-in-flight: 500     # checks running at once on this instance
  alerts:
    mail-from: ${ALERT_MAIL_FROM:Pulse <alerts@pulse.local>}
  ai:
    # Any OpenAI-compatible Chat Completions API. Default: Google Gemini (free tier).
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${AI_API_KEY:}        # empty = AI summaries are skipped
    model: ${AI_MODEL:gemini-3.5-flash-lite}
    timeout: 10s
